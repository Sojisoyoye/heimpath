# Production backend services — Hetzner VPS
# Run alongside docker-compose.staging.yml for a full stack:
#   docker-compose -f docker-compose.prod.yml -f docker-compose.staging.yml up -d

services:

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD?Variable not set}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD?Variable not set}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    volumes:
      - app-redis-data:/data
    networks:
      - heimpath

  prestart:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: bash scripts/prestart.sh
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - heimpath

  backend:
    container_name: heimpath-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    networks:
      - heimpath
      - modish_modish

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --hostname=worker@%h
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SENTRY_DSN=${SENTRY_DSN}
      - AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY}
      - AZURE_TRANSLATOR_REGION=${AZURE_TRANSLATOR_REGION}
      - AZURE_TRANSLATOR_ENDPOINT=${AZURE_TRANSLATOR_ENDPOINT}
      - AZURE_DOCUMENT_TRANSLATOR_ENDPOINT=${AZURE_DOCUMENT_TRANSLATOR_ENDPOINT}
    depends_on:
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    networks:
      - heimpath

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    networks:
      - heimpath

volumes:
  app-redis-data:

networks:
  heimpath:
    driver: bridge
  modish_modish:
    external: true
    name: modish_modish
